<!DOCTYPE html>
<html lang="fr" id="html-root">

        extend: {
          colors: {
            style: {
              bg: '#f0f3f6',

              violet: '#7C3AED',
              orange: '#F97316',
              dark: '#102a38',
              border: '#dbe2ea',
              muted: '#64748b'

    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@600;700;800;900&display=swap');
    
    body {
      background-color: #f0f3f6;
      color: #102a38;
      overflow: hidden;
      user-select: none;
      font-family: 'Inter', sans-serif;
    }

    /* Capsule Pill Styling */
    .capsule-pill {
      border-radius: 9999px;
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 6px 16px -3px rgba(0, 0, 0, 0.1), 0 3px 6px -2px rgba(0, 0, 0, 0.05);
    }
    .capsule-pill:hover {
      transform: translateY(-2px) scale(1.008);
      box-shadow: 0 12px 24px -4px rgba(0, 0, 0, 0.18);
    }

    .capsule-vertical {
      border-radius: 28px;
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 6px 16px -3px rgba(0, 0, 0, 0.1);
    }
    .capsule-vertical:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 24px -4px rgba(0, 0, 0, 0.18);
    }

    .photo-card {
      background: #ffffff;
      border: 1px solid #dbe2ea;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 8px 20px -4px rgba(0, 0, 0, 0.08);
      transition: all 0.35s ease;
    }
    .photo-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 30px -6px rgba(0, 122, 135, 0.2);
      border-color: #7C3AED;
    }

    .pill-red { background: linear-gradient(135deg, #F97316 0%, #EA580C 100%); }
    .pill-teal { background: linear-gradient(135deg, #7C3AED 0%, #6D28D9 100%); }
    .pill-orange { background: linear-gradient(135deg, #F97316 0%, #EA580C 100%); }
    .pill-blue { background: linear-gradient(135deg, #2563EB 0%, #1D4ED8 100%); }
    .pill-dark { background: linear-gradient(135deg, #163647 0%, #0c202b 100%); }

    .circle-badge {
      width: 42px;
      height: 42px;
      border-radius: 9999px;
      background-color: #ffffff;
      color: #102a38;
      font-weight: 800;
      font-size: 1.15rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2);
      flex-shrink: 0;
      line-height: 1;
    }

    .central-hub {
      background: #ffffff;
      border: 4px solid #7C3AED;
      box-shadow: 0 15px 35px -5px rgba(0, 122, 135, 0.25), 0 8px 15px -4px rgba(0, 0, 0, 0.08);
      border-radius: 9999px;
    }

    /* Carousel Expertise */
    .expertise-carousel {
      transition: background 0.5s ease;
    }

    .pole-content {
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Animation Steps */
    .slide-item {
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 0.55s ease, transform 0.55s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .slide-item.revealed {
      opacity: 1;
      transform: translateY(0);
    }
    .slide-item.from-left { transform: translateX(-35px); }
    .slide-item.from-left.revealed { transform: translateX(0); }
    .slide-item.from-right { transform: translateX(35px); }
    .slide-item.from-right.revealed { transform: translateX(0); }
    .slide-item.zoom-in { transform: scale(0.92); }
    .slide-item.zoom-in.revealed { transform: scale(1); }

    /* Prevent slide content from being clipped at the top when it overflows the scroll area
       (flex centering + overflow would otherwise hide the first elements, e.g. the slide title) */
    #slide-container > div {
      margin-top: auto;
      margin-bottom: auto;
    }

    /* Canvas background */
    #bg-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      opacity: 0.25;
    }
    /* Custom Scrollbar for slide container on smaller viewports */
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
    
    @media (max-width: 640px) {
      .capsule-pill {
        border-radius: 20px;
      }
      .circle-badge {
        width: 34px !important;
        height: 34px !important;
        font-size: 0.95rem !important;
      }
    }
  </style>
</head>

    let currentSlideIdx = 0;
    let currentStep = 0;
    let autoPlayInterval = null;
    let autoPlaySpeed = 4000;

    function toggleAutoPlay() {
      const btn = document.getElementById('autoplay-btn');
      const text = document.getElementById('autoplay-text');

      if (autoPlayInterval) {
        clearInterval(autoPlayInterval);
        autoPlayInterval = null;
        text.innerText = "Lecture Auto";
        btn.classList.remove('bg-style-blue', 'text-white');
        btn.classList.add('bg-style-blue/10', 'text-style-blue');
      } else {
        autoPlayInterval = setInterval(() => {
          autoStep();
        }, autoPlaySpeed);
        text.innerText = "Pause";
        btn.classList.remove('bg-style-blue/10', 'text-style-blue');
        btn.classList.add('bg-style-blue', 'text-white');
      }
      lucide.createIcons();
    }

    function changeSpeed(val) {
      autoPlaySpeed = parseInt(val);
      if (autoPlayInterval) {
        clearInterval(autoPlayInterval);
        autoPlayInterval = null;
        autoPlayInterval = setInterval(() => {
          autoStep();
        }, autoPlaySpeed);
      }
    }

    function autoStep() {
      const slide = slides[currentSlideIdx];
      if (currentStep < slide.steps) {
        currentStep++;
        revealSteps(currentStep);
      } else {
        if (currentSlideIdx < slides.length - 1) {
          currentSlideIdx++;
          currentStep = 1;
          renderCurrentSlide();
        } else {
          clearInterval(autoPlayInterval);
          autoPlayInterval = null;
          document.getElementById('autoplay-text').innerText = "Rejouer Auto";
          document.getElementById('autoplay-btn').classList.remove('bg-style-blue', 'text-white');
          document.getElementById('autoplay-btn').classList.add('bg-style-blue/10', 'text-style-blue');
        }
      }
    }

    function renderCurrentSlide() {
      const slide = slides[currentSlideIdx];
      const container = document.getElementById('slide-container');
      
      container.innerHTML = slide.render();
      lucide.createIcons();

      document.getElementById('slide-indicator').innerText = `${String(slide.id).padStart(2, '0')} / ${String(slides.length).padStart(2, '0')}`;
      document.getElementById('slide-topic-name').innerText = `${slide.id}. ${slide.title}`;
      
      const progressPercent = ((currentSlideIdx + 1) / slides.length) * 100;
      document.getElementById('progress-bar').style.width = `${progressPercent}%`;

      revealSteps(currentStep);
    }

    function revealSteps(stepNum) {
      const items = document.querySelectorAll('.slide-item');
      items.forEach(item => {
        let matched = false;
        for (let i = 1; i <= stepNum; i++) {
          if (item.classList.contains(`step-${i}`)) {
            matched = true;
            break;
          }
        }
        if (matched) {
          item.classList.add('revealed');
        } else {
          item.classList.remove('revealed');
        }
      });

      // Diapo 4 : gestion du carrousel des pôles selon le step
      if (currentSlideIdx === 3) {
        for (let i = 1; i <= 3; i++) {
          const pole = document.getElementById('pole-' + i);
          const indicator = document.getElementById('indicator-' + i);
          if (i <= stepNum) {
            pole.classList.remove('hidden');
            indicator.classList.remove('bg-white/50');
            indicator.classList.add('bg-white');
          } else {
            pole.classList.add('hidden');
            indicator.classList.remove('bg-white');
            indicator.classList.add('bg-white/50');
          }
        }
      }
    }

    function nextStep() {
      const slide = slides[currentSlideIdx];
      if (currentStep < slide.steps) {
        currentStep++;
        revealSteps(currentStep);
      } else {
        if (currentSlideIdx < slides.length - 1) {
          currentSlideIdx++;
          currentStep = 1;
          renderCurrentSlide();
        }
      }
    }

    function prevStep() {
      if (currentStep > 1) {
        currentStep--;
        revealSteps(currentStep);
      } else {
        if (currentSlideIdx > 0) {
          currentSlideIdx--;
          currentStep = slides[currentSlideIdx].steps;
          renderCurrentSlide();
        }
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowRight' || e.code === 'PageDown') {
        e.preventDefault();
        nextStep();
      } else if (e.code === 'ArrowLeft' || e.code === 'PageUp' || e.code === 'Backspace') {
        e.preventDefault();
        prevStep();
      } else if (e.key === 'a' || e.key === 'A' || e.key === 'p' || e.key === 'P') {
        e.preventDefault();
        toggleAutoPlay();
      } else if (e.key === 'f' || e.key === 'F') {
        e.preventDefault();
        toggleFullscreen();
      } else if (e.key === 'Home') {
        e.preventDefault();
        currentSlideIdx = 0;
        currentStep = 1;
        renderCurrentSlide();
      } else if (e.key === 'End') {
        e.preventDefault();
        currentSlideIdx = slides.length - 1;
        currentStep = slides[currentSlideIdx].steps;
        renderCurrentSlide();
      }
    });

    // Touch Swipe Gestures for Mobile & Tablet
    let touchStartX = 0;
    let touchStartY = 0;
    let touchEndX = 0;
    let touchEndY = 0;

    window.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    window.addEventListener('touchend', (e) => {
      touchEndX = e.changedTouches[0].screenX;
      touchEndY = e.changedTouches[0].screenY;
      handleSwipe();
    }, { passive: true });

    function handleSwipe() {
      const diffX = touchEndX - touchStartX;
      const diffY = touchEndY - touchStartY;
      // Only trigger if horizontal swipe is greater than vertical drag
      if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 45) {
        if (diffX < 0) {
          nextStep();
        } else {
          prevStep();
        }
      }
    }

    // Background Canvas Particles
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.vx = (Math.random() - 0.5) * 0.4;
        this.vy = (Math.random() - 0.5) * 0.4;
        this.radius = Math.random() * 1.8 + 0.8;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
        if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#7C3AED';
        ctx.fill();
      }
    }

    for (let i = 0; i < 40; i++) {
      particles.push(new Particle());
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = 0; i < particles.length; i++) {
        particles[i].update();
        particles[i].draw();
        for (let j = i + 1; j < particles.length; j++) {
          const dx = particles[i].x - particles[j].x;
          const dy = particles[i].y - particles[j].y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 120) {
            ctx.beginPath();
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(particles[j].x, particles[j].y);
            ctx.strokeStyle = `rgba(0, 122, 135, ${0.12 * (1 - dist / 120)})`;
            ctx.lineWidth = 0.8;
            ctx.stroke();
          }
        }
      }
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    currentStep = 1;
    renderCurrentSlide();
  </script>
</body>
</html>
